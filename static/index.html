<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <title>YewChat - The Tavern</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        font-family: 'Lora', serif;
        --bg-tavern: #1a120e;
        --bg-parchment: #f0e2c8;
        --bg-parchment-dark: #e3d2b3;
        --border-wood: #3a2311;
        --text-ink: #2b1f17;
        --text-faded: #6a5747;
        --accent-crimson: #7a1f1f;
        --accent-crimson-hover: #5a1212;
        --accent-gold: #d4af37;
        --shadow-heavy: 0 15px 35px rgba(0,0,0,0.8);
      }

      body {
        background: radial-gradient(circle at center, #3d281c 0%, var(--bg-tavern) 100%);
        color: var(--text-ink);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #app-container {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      /* --- LOGIN SCREEN --- */
      .login-wrapper {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .login-container {
        background: var(--bg-parchment);
        border: 10px solid var(--border-wood);
        border-radius: 4px;
        padding: 40px;
        box-shadow: var(--shadow-heavy);
        text-align: center;
      }

      .login-container h1 {
        font-family: 'MedievalSharp', cursive;
        color: var(--accent-crimson);
        font-size: 36px;
        margin-bottom: 24px;
        text-shadow: 1px 1px 0 rgba(255,255,255,0.4);
      }

      .login-form {
        display: flex;
        gap: 10px;
      }

      /* --- CHAT WRAPPER --- */
      .tavern-chat-wrapper {
        width: 100%;
        max-width: 1000px;
        height: calc(100vh - 40px);
        background: var(--bg-parchment);
        border: 10px solid var(--border-wood);
        border-radius: 4px;
        box-shadow: var(--shadow-heavy), inset 0 0 50px rgba(139, 69, 19, 0.15);
        display: flex;
        flex-direction: row;
        overflow: hidden;
      }

      /* --- SIDEBAR --- */
      .tavern-sidebar {
        width: 260px;
        border-right: 4px double var(--border-wood);
        background: rgba(180, 140, 90, 0.2);
        display: flex;
        flex-direction: column;
      }

      .sidebar-header {
        font-family: 'MedievalSharp', cursive;
        font-size: 24px;
        color: var(--accent-crimson);
        padding: 20px;
        text-align: center;
        border-bottom: 2px solid var(--border-wood);
        background: rgba(0,0,0,0.05);
      }

      .patrons-list {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
      }

      .patron-card {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px;
        margin-bottom: 12px;
        background: var(--bg-parchment-dark);
        border: 1px solid var(--border-wood);
        border-radius: 4px;
        box-shadow: inset 0 1px 2px rgba(0,0,0,0.1);
      }

      /* --- MAIN CHAT AREA --- */
      .tavern-main {
        flex: 1;
        display: flex;
        flex-direction: column;
        background-image: repeating-linear-gradient(rgba(0,0,0,0.02) 0px, rgba(0,0,0,0.02) 2px, transparent 2px, transparent 4px);
      }

      .chat-header {
        padding: 20px;
        border-bottom: 4px double var(--border-wood);
        background: rgba(180, 140, 90, 0.2);
        text-align: center;
      }

      .chat-header h1 {
        font-family: 'MedievalSharp', cursive;
        font-size: 28px;
        color: var(--accent-crimson);
        letter-spacing: 2px;
        text-shadow: 1px 1px 0 rgba(255,255,255,0.4);
      }

      .messages-area {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .message-card {
        display: flex;
        align-items: flex-start;
        gap: 16px;
        background: rgba(255, 255, 255, 0.5);
        border: 1px solid var(--border-wood);
        padding: 16px;
        border-radius: 8px;
        width: fit-content;
        max-width: 80%;
      }

      .message-sender {
        font-weight: bold;
        color: var(--accent-crimson);
        margin-bottom: 4px;
        font-family: 'MedievalSharp', cursive;
      }

      .message-text {
        color: var(--text-ink);
        line-height: 1.5;
      }

      /* --- INPUT AREA --- */
      .input-area {
        padding: 20px;
        border-top: 4px double var(--border-wood);
        background: rgba(180, 140, 90, 0.2);
        display: flex;
        gap: 12px;
      }

      /* --- GLOBAL ELEMENTS (Inputs, Buttons, Images) --- */
      img {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 2px solid var(--border-wood);
        background: #fff;
        object-fit: cover;
      }

      .gif-embed {
        width: 150px;
        height: auto;
        border-radius: 4px;
      }

      input {
        flex: 1;
        padding: 12px 16px;
        border: 2px solid var(--border-wood);
        border-radius: 3px;
        font-size: 16px;
        font-family: 'Lora', serif;
        background: rgba(255, 255, 255, 0.6);
        color: var(--text-ink);
        outline: none;
      }

      input::placeholder { color: var(--text-faded); font-style: italic; }
      input:focus { background: rgba(255,255,255,0.9); border-color: var(--accent-crimson); }

      button {
        background: var(--accent-crimson);
        color: var(--accent-gold);
        border: 2px solid var(--border-wood);
        padding: 12px 24px;
        font-size: 16px;
        font-family: 'MedievalSharp', cursive;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.2s;
        box-shadow: 0 4px 6px rgba(0,0,0,0.4);
      }

      button:hover:not(:disabled) {
        background: var(--accent-crimson-hover);
        transform: translateY(-2px);
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      ::-webkit-scrollbar { width: 14px; }
      ::-webkit-scrollbar-track { background: var(--bg-parchment); border-left: 2px solid var(--border-wood); }
      ::-webkit-scrollbar-thumb { background: var(--border-wood); border: 2px solid var(--bg-parchment); border-radius: 2px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--accent-crimson); }
    </style>
  </head>
  <body>
    <script src="yewchat.js"></script>
  </body>
</html>
